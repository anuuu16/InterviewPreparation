<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Prep Manager</title>
<style>
  :root { --bg:#fafafa; --fg:#1d1d1f; --mut:#6e6e73; --card:#fff; --line:#e3e3e8; --acc:#2f6feb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16161a; --fg:#ececf0; --mut:#9a9aa5; --card:#1f1f25; --line:#34343c; --acc:#6c9bff; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); display:flex; min-height:100vh; }
  aside { width:230px; padding:20px 16px; border-right:1px solid var(--line); flex-shrink:0; }
  aside h1 { font-size:16px; margin:0 0 16px; }
  aside button.topic { display:block; width:100%; text-align:left; background:none; border:0; color:var(--fg); padding:7px 10px; border-radius:6px; cursor:pointer; font:inherit; }
  aside button.topic.on { background:var(--acc); color:#fff; }
  main { flex:1; padding:20px 28px; max-width:900px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  input, select, textarea, button { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  textarea { width:100%; min-height:90px; }
  button { cursor:pointer; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  .bar input[type=search] { flex:1; min-width:160px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-bottom:10px; }
  .card h3 { margin:0; font-size:15px; display:flex; gap:8px; align-items:flex-start; cursor:pointer; }
  .card h3 span.q { flex:1; }
  .star { background:none; border:0; font-size:18px; padding:0; color:var(--mut); }
  .star.on { color:#f5a623; }
  .badge { font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--mut); }
  .ans { white-space:pre-wrap; margin-top:10px; display:none; }
  .card.open .ans, .card.open .actions { display:block; }
  .actions { display:none; margin-top:10px; }
  .form { display:grid; gap:8px; }
  .muted { color:var(--mut); }
  @media (max-width:640px) { body { flex-direction:column; } aside { width:auto; border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <h1>📚 Interview Prep</h1>
  <div id="topics"></div>
  <p><button id="newTopic">+ New topic</button></p>
</aside>
<main>
  <div id="view"><p class="muted">Pick or create a topic.</p></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = (p, method = 'GET', body) =>
  fetch('/api' + p, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }).then(async (r) => {
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Request failed');
    return d;
  });

let topics = [], slug = null, topic = null;
let filter = { text: '', level: '', fav: false };
let editing = null; // question id, 'new', or null

async function loadTopics() {
  topics = await api('/topics');
  $('#topics').innerHTML = topics.map((t) => `<button class="topic ${t.slug === slug ? 'on' : ''}" data-s="${t.slug}">${esc(t.name)}</button>`).join('');
}
async function open(s) { slug = s; topic = await api('/topics/' + s); editing = null; await loadTopics(); render(); }

function render() {
  if (!topic) return;
  const qs = topic.questions.filter((q) =>
    (!filter.level || q.level === filter.level) && (!filter.fav || q.favorite) &&
    (!filter.text || (q.question + q.answer + q.tags.join(' ')).toLowerCase().includes(filter.text.toLowerCase())));
  $('#view').innerHTML = `
    <h2>${esc(topic.name)} <span class="muted">(${topic.questions.length})</span></h2>
    <div class="bar">
      <input type="search" id="f-text" placeholder="Search…" value="${esc(filter.text)}">
      <select id="f-level"><option value="">All levels</option>${['basic','intermediate','advanced'].map((l) => `<option ${filter.level === l ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <label><input type="checkbox" id="f-fav" ${filter.fav ? 'checked' : ''}> ⭐ only</label>
      <button class="primary" id="add">+ Add question</button>
    </div>
    ${editing === 'new' ? form({ question: '', answer: '', level: 'basic', tags: [] }) : ''}
    ${qs.map((q) => editing === q.id ? form(q) : card(q)).join('') || '<p class="muted">No questions.</p>'}`;
  const t = $('#f-text'); if (document.activeElement === document.body && filter.text) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
}
const card = (q) => `
  <div class="card" data-id="${q.id}">
    <h3><button class="star ${q.favorite ? 'on' : ''}" data-a="fav">${q.favorite ? '★' : '☆'}</button><span class="q" data-a="toggle">${esc(q.question)}</span><span class="badge">${q.level}</span></h3>
    <div class="ans">${esc(q.answer) || '<span class="muted">No answer yet.</span>'}${q.tags.length ? `<p class="muted">${q.tags.map(esc).join(', ')}</p>` : ''}</div>
    <div class="actions"><button data-a="edit">Edit</button> <button data-a="del">Delete</button></div>
  </div>`;
const form = (q) => `
  <div class="card form" data-id="${q.id || ''}">
    <input id="e-q" placeholder="Question" value="${esc(q.question)}">
    <textarea id="e-a" placeholder="Answer (Markdown)">${esc(q.answer)}</textarea>
    <div class="bar">
      <select id="e-l">${['basic','intermediate','advanced'].map((l) => `<option ${q.level === l ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <input id="e-t" placeholder="tags, comma separated" value="${esc(q.tags.join(', '))}" style="flex:1">
      <button class="primary" data-a="save">Save</button> <button data-a="cancel">Cancel</button>
    </div>
  </div>`;

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-a], .topic, #add, #newTopic');
  if (!el) return;
  try {
    if (el.matches('.topic')) return open(el.dataset.s);
    if (el.id === 'newTopic') {
      const name = prompt('Topic name (e.g. Go, System Design):');
      if (!name) return;
      const t = await api('/topics', 'POST', { name });
      return open(t.slug);
    }
    if (el.id === 'add') { editing = 'new'; return render(); }
    const id = el.closest('.card')?.dataset.id;
    const q = topic.questions.find((x) => x.id === id);
    switch (el.dataset.a) {
      case 'toggle': el.closest('.card').classList.toggle('open'); break;
      case 'fav': Object.assign(q, await api(`/topics/${slug}/questions/${id}`, 'PUT', { favorite: !q.favorite })); render(); break;
      case 'edit': editing = id; render(); break;
      case 'cancel': editing = null; render(); break;
      case 'del': if (confirm('Delete this question?')) { await api(`/topics/${slug}/questions/${id}`, 'DELETE'); await open(slug); } break;
      case 'save': {
        const body = { question: $('#e-q').value, answer: $('#e-a').value, level: $('#e-l').value, tags: $('#e-t').value.split(',') };
        if (id) await api(`/topics/${slug}/questions/${id}`, 'PUT', body); else await api(`/topics/${slug}/questions`, 'POST', body);
        await open(slug);
      }
    }
  } catch (err) { alert(err.message); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'f-text') { filter.text = e.target.value; render(); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'f-level') { filter.level = e.target.value; render(); }
  if (e.target.id === 'f-fav') { filter.fav = e.target.checked; render(); }
});
loadTopics().then(() => topics[0] && open(topics[0].slug));
</script>
</body>
</html>
